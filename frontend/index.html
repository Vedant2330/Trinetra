<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRINETRA Command Center</title>
    <!-- Theme bootstrap: apply .dark before first paint so there is no
         flash on load. Runs before any CSS is applied. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('trinetra-theme');
          var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* ignore — default is dark-first */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%2316A34A' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2316A34A'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
