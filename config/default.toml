# TRINETRA configuration — Phase 2 MVP
# All zones/sources runtime state lives in SQLite (data/trinetra.db), not here.
# This file defines process-level settings only.

[device]
# auto | mps | cpu  — auto: use MPS if available, fall back to CPU on failure
policy = "auto"

[vision]
model = "yolov8n.pt"
conf = 0.35
imgsz = 640
max_frame_width = 1280
classes = [0, 1, 2, 3, 5, 7]          # person bicycle car motorcycle bus truck

[tracking]
min_confirm_frames = 3
lost_timeout_frames = 30
history_len = 60

[fence]
confirm_frames = 3
exit_grace_frames = 10

[events]
cooldown_seconds = 10
snapshot_min_severity = "MEDIUM"

[stream]
mjpeg_quality = 70
max_fps = 20

# --- M6 hardening (§20) ---
[sources]
# Webcam disconnect ladder: SOURCE_LOST -> backoff 1->2->4->8s (capped),
# interruptible (never time.sleep) -> reopen -> SOURCE_RECONNECTED once.
backoff_base_s = 1.0
backoff_cap_s = 8.0
# Consecutive decode failures that abort a FILE session mid-stream (§20
# corrupt-truncated-file row). < limit = skip+count; >= limit = error.
decode_fail_limit = 60

[paths]
uploads = "uploads"
data = "data"
retention_days = 7
# Disk-low evidence gate (C12): snapshots skipped (event still commits,
# flagged snapshot_skipped_low_disk) when free space falls below this.
min_free_mb = 200
